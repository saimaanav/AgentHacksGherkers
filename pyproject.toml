[project]
name = "pakka"
version = "0.1.0"
description = "Pull requests for agent actions - a staging layer that holds every write, lets the agent finish, and learns from your reviews."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "modal",
    "fastapi",
    "pydantic>=2",
    "pydantic-ai",
    "logfire",
]

[project.optional-dependencies]
dev = ["pytest", "playwright", "httpx", "uvicorn"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pakka*"]

[tool.setuptools.package-data]
pakka = ["sim/transcripts/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
