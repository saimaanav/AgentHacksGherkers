<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pakka</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181e;
    --panel-2: #1b2129;
    --line: #262d37;
    --text: #eef1f5;
    --muted: #8a93a3;
    --amber: #f5b342;
    --amber-dim: rgba(245, 179, 66, 0.14);
    --green: #3ddc84;
    --green-dim: rgba(61, 220, 132, 0.12);
    --red: #ff5c5c;
    --red-dim: rgba(255, 92, 92, 0.14);
    --blue: #6db3ff;
    --radius: 14px;
    --fs: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    font-size: var(--fs);
    line-height: 1.35;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.85em; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 18px 32px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand .name { font-size: 1.6em; font-weight: 800; letter-spacing: -0.02em; }
  .brand .sub { color: var(--muted); font-size: 0.85em; }
  nav { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 18px; cursor: pointer; font-weight: 600; font-size: 0.95em; transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: #232b35; border-color: #3a4451; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { background: #fff; }
  .btn.amber { background: var(--amber); color: #1a1200; border-color: var(--amber); }
  .btn.danger { background: var(--red-dim); color: var(--red); border-color: rgba(255,92,92,0.4); }
  .btn.ghost { background: transparent; }
  .btn.active { outline: 2px solid var(--amber); }
  .btn.small { padding: 6px 12px; font-size: 0.8em; }

  main { flex: 1; padding: 28px 32px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
  .panel h2 { margin: 0 0 14px; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .amber { color: var(--amber); }
  .green { color: var(--green); }
  .red { color: var(--red); }

  /* opening */
  .hero { padding: 40px 0 28px; }
  .hero .label { color: var(--muted); font-size: 0.9em; margin-bottom: 10px; }
  .hero .line { font-size: 3.2em; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 0; }
  .hero .after { margin-top: 18px; color: var(--muted); font-size: 1.05em; }
  .hero .after b { color: var(--text); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
  .actions .btn { font-size: 1.1em; padding: 14px 24px; }

  /* the world */
  .systems { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .system { background: var(--panel-2); border-radius: 12px; padding: 14px 16px; }
  .system .n { font-size: 2.4em; font-weight: 800; line-height: 1; transition: color 0.2s; }
  .system .n.lit { color: var(--green); }
  .system .name { color: var(--muted); font-size: 0.8em; margin-top: 6px; }
  .effects { margin-top: 14px; max-height: 420px; overflow: auto; }
  .effect { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: 0.8em; animation: fade 0.3s ease-out; }
  .effect .id { color: var(--green); }
  .effect .from { color: var(--muted); }

  /* review */
  .cards { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; transition: opacity 0.3s; }
  .card.flagged { border-color: rgba(245,179,66,0.55); box-shadow: 0 0 0 1px rgba(245,179,66,0.25) inset; }
  .card.discarded { opacity: 0.45; }
  .card.discarded .title { text-decoration: line-through; }
  .card.rule { border-color: rgba(109,179,255,0.5); }
  .card .top { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  .card .title { font-size: 1.25em; font-weight: 700; }
  .card .amount { font-size: 1.35em; font-weight: 800; letter-spacing: -0.02em; }
  .card .meta { color: var(--muted); font-size: 0.85em; margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }
  .card .meta code { color: var(--text); }
  .flag { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--amber-dim); color: var(--amber); font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
  .flag .kind { font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8; }
  .deps { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .dep { display: flex; gap: 10px; align-items: baseline; font-size: 0.85em; color: var(--muted); flex-wrap: wrap; min-width: 0; }
  .dep > span { min-width: 0; overflow-wrap: anywhere; }
  .dep .tool { color: var(--text); font-weight: 600; }
  .dep .status { margin-left: auto; font-size: 0.85em; }
  .dep.sent .status { color: var(--green); }
  .dep.skipped { opacity: 0.55; }
  .dep.skipped .status { color: var(--red); }
  .card .foot { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .card .foot .note { color: var(--muted); font-size: 0.8em; }
  .details { margin-top: 12px; background: #0e1115; border-radius: 10px; padding: 12px 14px; font-size: 0.72em; white-space: pre-wrap; word-break: break-word; color: #c6cdd8; max-height: 360px; overflow: auto; }
  .diff { margin-top: 10px; display: grid; gap: 8px; }
  .diff .side { background: #0e1115; border-radius: 10px; padding: 12px 14px; font-size: 0.85em; white-space: pre-wrap; word-break: break-word; }
  .diff .side .lab { display: block; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 6px; }
  .diff del { background: var(--red-dim); color: var(--red); text-decoration: line-through; border-radius: 4px; padding: 0 3px; }
  .diff .side.after { border-left: 3px solid var(--green); }
  .review-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .review-head .sum { color: var(--muted); }
  .review-head .sum b { color: var(--text); }

  /* montage */
  .friday-strip { display: flex; flex-direction: column; gap: 12px; }
  .friday { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 20px; animation: fade 0.3s ease-out; }
  .friday .fh { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .friday .fh .t { font-weight: 800; font-size: 1.1em; }
  .friday .fh .tag { color: var(--muted); font-size: 0.8em; }
  .friday .fh .tag.approve { color: var(--green); }
  .friday .writes { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 0.72em; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); color: var(--muted); animation: pop 0.25s ease-out; }
  .chip.sent { background: var(--green-dim); color: var(--green); }
  .chip.held { background: var(--amber-dim); color: var(--amber); }
  .learned .events { max-height: min(440px, calc(100vh - 460px)); overflow: auto; }
  .learned .ev { padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.85em; animation: fade 0.3s ease-out; }
  .learned .ev .k { display: inline-block; min-width: 92px; margin-right: 10px; color: var(--muted); font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.1em; }
  .learned .ev.promotion { color: var(--green); font-weight: 600; }
  .learned .ev.rule { color: var(--blue); }
  .learned .ents { margin-top: 10px; display: grid; gap: 6px; }
  .ent { display: flex; justify-content: space-between; gap: 10px; font-size: 0.8em; padding: 6px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .ent .nm { font-weight: 600; }
  .ent .rg { color: var(--muted); }
  .ladder { margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
  .ladder .chip { animation: none; } /* re-rendered every run; never caught mid-fade on a frame */

  /* autopilot */
  .counters { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .counter { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .counter .n { font-size: 2.2em; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .counter .l { color: var(--muted); font-size: 0.75em; margin-top: 6px; }
  .counter.held .n { color: var(--amber); }
  .counter.through .n { color: var(--green); }
  .score { font-size: 1.5em; font-weight: 800; margin: 0 0 16px; }
  .score .ok { color: var(--green); }
  .score .bad { color: var(--red); }
  .feed { display: flex; flex-direction: column; gap: 4px; max-height: min(520px, calc(100vh - 400px)); overflow: auto; }
  .row { display: flex; gap: 12px; align-items: baseline; padding: 6px 12px; border-radius: 8px; font-size: 0.85em; animation: fade 0.25s ease-out; }
  .row .f { color: var(--muted); min-width: 4.5em; font-size: 0.85em; }
  .row .tool { font-weight: 600; min-width: 8em; }
  .row .what { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.pass { background: var(--green-dim); }
  .row.pass .tool { color: var(--green); }
  .row.hold { background: var(--amber-dim); }
  .row.hold .tool { color: var(--amber); }
  .row.hold .what { color: var(--amber); white-space: normal; }
  .row.sep { background: transparent; color: var(--muted); font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.1em; padding-top: 12px; }
  .held-list .h { padding: 10px 0; border-top: 1px solid var(--line); animation: fade 0.3s ease-out; }
  .held-list .h .t { font-weight: 700; }
  .held-list .h .r { color: var(--amber); font-size: 0.85em; }
  .held-list .h .m { color: var(--muted); font-size: 0.75em; }
  .empty { color: var(--muted); font-size: 0.85em; }

  footer { padding: 16px 32px 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85em; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer .classes { letter-spacing: 0.02em; }

  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }

  @media (max-width: 1100px) {
    .counters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 820px) {
    :root { --fs: 17px; }
    header { padding: 14px 16px; }
    main { padding: 18px 16px; }
    footer { padding: 14px 16px; }
    .cols { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .hero { padding: 16px 0 10px; }
    .hero .line { font-size: 2.1em; }
    .actions .btn { font-size: 1em; padding: 12px 16px; }
    .systems { gap: 8px; }
    .system .n { font-size: 1.8em; }
    .counters { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .counter .n { font-size: 1.7em; }
    .row .what { white-space: normal; }
    .card .amount { font-size: 1.15em; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="name">pakka</span><span class="sub" id="sub">loading</span></div>
    <nav>
      <button class="btn" id="b-review" data-action="review" disabled>Review</button>
      <button class="btn" id="b-montage" data-action="montage" disabled>Play 5 Fridays</button>
      <button class="btn" id="b-auto" data-action="autopilot" disabled>Autopilot</button>
      <button class="btn ghost" id="b-reset" data-action="reset" disabled>Reset</button>
    </nav>
  </header>
  <main id="main"></main>
  <footer>
    <span class="classes">ledgers · payment rails · CRMs · email · databases · deploys · tickets</span>
    <span id="foot-note" class="muted"></span>
  </footer>
  <script src="/web/app.js"></script>
</body>
</html>
