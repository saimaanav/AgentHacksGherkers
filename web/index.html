<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pakka</title>
<link rel="icon" href="data:,">
<style>
  /* Linear-derived: near-black surface ladder, hairline dividers, hierarchy from
     type weight rather than boxes. Amber/green/red are the only hue and mean state.
     Fonts are vendored in web/fonts/ (sources and hashes in its README); no CDN. */
  @font-face {
    font-family: InterVariable;
    src: url(/web/fonts/InterVariable.woff2) format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url(/web/fonts/JetBrainsMono-Regular.woff2) format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --void: #08090a;
    --carbon: #0f1011;
    --obsidian: #161718;
    --graphite: #23252a;
    --smoke: #383b3f;
    --ash: #62666d;
    --fog: #8a8f98;
    --mist: #d0d6e0;
    --paper: #ffffff;
    --amber: #f0b13d;   --amber-wash: rgba(240, 177, 61, 0.07);
    --green: #3fb950;   --green-wash: rgba(63, 185, 80, 0.08);
    --red: #eb5757;     --red-wash: rgba(235, 87, 87, 0.10);
    --r-card: 12px; --r-tile: 6px; --r-btn: 6px;
    --pad-x: max(24px, calc((100vw - 1400px) / 2));
    --sans: InterVariable, "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Berkeley Mono", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --move: 320ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--graphite) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--graphite); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--smoke); }
  :focus-visible { outline: 2px solid var(--fog); outline-offset: 1px; }
  html, body { margin: 0; padding: 0; background: var(--void); color: var(--mist); }
  body {
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    font-feature-settings: "cv01", "ss03", "zero";
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  b, strong { font-weight: 590; } /* the system caps at 590; never synthetic 700 */
  code, .mono { font-family: var(--mono); font-size: 0.9em; letter-spacing: 0; }
  mark { background: var(--amber-wash); color: var(--amber); border-radius: 2px; padding: 0 2px; box-shadow: inset 0 0 0 1px rgba(240, 177, 61, 0.35); }

  header {
    display: grid; grid-template-columns: auto 1fr auto; align-items: stretch; column-gap: 16px;
    padding: 0 var(--pad-x); min-height: 52px; border-bottom: 1px solid var(--graphite);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { display: inline-flex; align-items: center; gap: 3px; }
  .mark::before, .mark::after { content: ""; width: 3px; height: 11px; background: var(--paper); border-radius: 1px; }
  .brand .name { font-size: 15px; font-weight: 590; letter-spacing: -0.01em; color: var(--paper); }
  .brand .sub { color: var(--fog); font-size: 13px; }
  .brand .sub:not(:empty)::before { content: "/"; color: var(--smoke); margin-right: 10px; }
  nav { display: flex; align-items: stretch; justify-self: center; }
  .tools { display: flex; align-items: center; gap: 6px; justify-self: end; }
  .btn {
    background: transparent; color: var(--mist); border: 1px solid var(--graphite); border-radius: var(--r-btn);
    padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 510; line-height: 1.3;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .btn:hover { background: var(--obsidian); border-color: var(--smoke); color: var(--paper); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--paper); color: var(--void); border-color: var(--paper); font-weight: 590; }
  .btn.primary:hover { background: var(--mist); }
  .btn.amber { background: var(--amber); color: #151003; border-color: var(--amber); font-weight: 590; }
  .btn.amber:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--red); border-color: rgba(235, 87, 87, 0.35); }
  .btn.danger:hover { background: var(--red-wash); border-color: rgba(235, 87, 87, 0.6); color: var(--red); }
  .btn.ghost { border-color: transparent; color: var(--fog); }
  .btn.small { padding: 3px 9px; font-size: 12.5px; }
  nav .btn { border: 0; border-radius: 0; background: transparent; color: var(--fog); padding: 0 14px; position: relative; }
  nav .btn:hover { background: transparent; color: var(--paper); }
  nav .btn.active { color: var(--paper); }
  nav .btn.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--paper); border-radius: 1px; }
  nav .btn:disabled { opacity: 0.35; }
  .btn .count { margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--amber-wash); color: var(--amber); font-size: 11px; font-weight: 590; font-variant-numeric: tabular-nums; }
  .btn .count.plain { background: rgba(255, 255, 255, 0.06); color: var(--mist); }
  .tools .btn { border: 1px solid var(--graphite); border-radius: var(--r-btn); color: var(--fog); padding: 5px 12px; }
  .tools .btn:hover { border-color: var(--smoke); color: var(--paper); background: transparent; }
  .tools .btn.primary { color: var(--void); border-color: var(--paper); background: var(--paper); }
  .tools .btn.primary:hover { background: var(--mist); color: var(--void); }

  main { flex: 1; padding: 16px var(--pad-x) 20px; width: 100%; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .panel { background: var(--carbon); border: 1px solid var(--graphite); border-radius: var(--r-card); padding: 14px 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; font-weight: 510; color: var(--fog); }
  .muted { color: var(--fog); }
  .amber { color: var(--amber); }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .hint { color: var(--fog); font-size: 12.5px; }
  .note { color: var(--fog); font-size: 12.5px; }
  .err { color: var(--amber); font-size: 12.5px; font-weight: 510; margin-top: 6px; }
  .err[hidden] { display: none; }

  /* ---- above the board: the job bar and the stats strip ---- */
  #jobbar { flex: none; padding: 2px 0 10px; }
  #job-form { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; }
  #job-form .prompt { font-family: var(--sans); font-size: 14px; background: var(--carbon); color: var(--paper); border: 1px solid var(--graphite); border-radius: var(--r-btn); padding: 8px 12px; min-width: 0; width: 100%; }
  #job-form .prompt:focus { outline: none; border-color: var(--smoke); }
  #job-form select { font-family: var(--sans); font-size: 13px; background: var(--carbon); color: var(--mist); border: 1px solid var(--graphite); border-radius: var(--r-btn); padding: 8px 10px; max-width: 260px; }
  #job-form .pick { position: relative; }
  #job-form .pick summary { list-style: none; cursor: pointer; font-size: 13px; color: var(--mist); border: 1px solid var(--graphite); border-radius: var(--r-btn); padding: 8px 12px; background: var(--carbon); white-space: nowrap; }
  #job-form .pick summary::-webkit-details-marker { display: none; }
  #job-form .pick summary::after { content: " ▾"; color: var(--fog); }
  #job-form .pick summary .n { color: var(--amber); font-weight: 590; }
  #job-form .pick .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 300px; background: var(--obsidian); border: 1px solid var(--graphite); border-radius: var(--r-tile); padding: 8px 10px; display: grid; gap: 4px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); }
  #job-form .pick .menu label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 2px; cursor: pointer; }
  #job-form .pick .menu label span:first-of-type { color: var(--paper); }
  #job-form .pick .menu .hint { padding-top: 4px; border-top: 1px solid var(--graphite); }
  #job-form .btn.primary { padding: 8px 18px; }
  #job-form .err { grid-column: 1 / -1; }
  #stats { flex: none; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--fog); padding: 0 2px 12px; }
  #stats .k { color: var(--paper); font-weight: 590; font-size: 13px; }
  #stats .q { color: var(--mist); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
  #stats .v b { color: var(--paper); font-weight: 590; font-variant-numeric: tabular-nums; }
  #stats .v b.green { color: var(--green); }
  #stats .v b.amber { color: var(--amber); }
  #stats .said { flex-basis: 100%; color: var(--fog); }
  #stats .said::before { content: "the agent said: "; color: var(--ash); }
  .chip { font-size: 11.5px; line-height: 1.5; padding: 1px 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.04); color: var(--fog); animation: pop 0.25s ease-out; }
  .chip.released { color: var(--green); background: var(--green-wash); }
  .chip.held { background: var(--amber-wash); color: var(--amber); }
  .chip.as-btn { border: 0; cursor: pointer; font: inherit; font-size: 11.5px; }
  .chip.as-btn:hover { filter: brightness(1.15); }

  /* ---- the board ---- */
  #board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; flex: 1; min-height: 360px; }
  .col { display: flex; flex-direction: column; min-height: 0; background: var(--carbon); border: 1px solid var(--graphite); border-radius: var(--r-card); position: relative; }
  .col::before { content: ""; position: absolute; left: 12px; right: 12px; top: 0; height: 2px; background: transparent; border-radius: 0 0 2px 2px; }
  .col[data-col="needs_approval"]::before { background: var(--amber); }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--graphite); flex-wrap: wrap; }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 590; color: var(--mist); letter-spacing: -0.005em; }
  .col[data-col="needs_approval"] .col-head h2 { color: var(--paper); }
  .col-head .count { padding: 0 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.05); color: var(--fog); font-size: 11px; font-weight: 590; font-variant-numeric: tabular-nums; min-width: 20px; text-align: center; line-height: 18px; }
  .col[data-col="needs_approval"] .col-head .count { background: var(--amber-wash); color: var(--amber); font-size: 13px; line-height: 20px; }
  .col[data-col="complete"] .col-head .count { background: var(--green-wash); color: var(--green); }
  .col-head .sum { flex-basis: 100%; color: var(--fog); font-size: 12px; margin-top: 2px; }
  .col-head .sum b { color: var(--paper); font-weight: 590; }
  .col-head .sum .amber { color: var(--amber); }
  .col-head .act { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .col-head .banner { color: var(--green); font-size: 12px; font-weight: 510; flex-basis: 100%; }
  .col.flash .col-head { animation: colflash 0.9s ease-out; }
  .col-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overflow-anchor: none; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .col-body .empty { color: var(--ash); font-size: 12.5px; padding: 6px 4px; }
  .col-body .group { color: var(--fog); font-size: 11.5px; font-weight: 510; padding: 6px 4px 0; display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--graphite); margin-top: 2px; }
  .col-body .group:first-child { border-top: 0; margin-top: 0; padding-top: 2px; }
  .col-body .group .g-n { color: var(--ash); font-variant-numeric: tabular-nums; }

  /* cards: one persistent element per chain; a title, the steps as dots, one line of status */
  .card { background: var(--obsidian); border: 1px solid var(--graphite); border-radius: 8px; padding: 9px 11px 9px 10px; border-left: 2px solid transparent; position: relative; cursor: pointer; }
  .card.enter { animation: card-in 0.3s ease-out; }
  .card.ghost { position: fixed; margin: 0; pointer-events: none; will-change: transform; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); }
  #ghosts { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  .card:hover { border-color: var(--smoke); border-left-color: var(--smoke); }
  .card.flagged { border-left-color: var(--amber); }
  .card.flagged:hover { border-left-color: var(--amber); }
  .card.discarded { opacity: 0.5; }
  .card.discarded .open .title { text-decoration: line-through; }
  .card.marked { border-color: var(--smoke); }
  .card.marked:not(.discarded) { border-left-color: var(--green); }
  .btn.chosen { box-shadow: 0 0 0 2px var(--void), 0 0 0 3px var(--fog); }
  .team .kv { font-size: 13.5px; color: var(--mist); }
  .team .kv code { color: var(--paper); }
  .team .ra { margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .team .ra input { font-family: var(--sans); font-size: 13px; background: var(--obsidian); color: var(--mist); border: 1px solid var(--graphite); border-radius: var(--r-btn); padding: 5px 9px; min-width: 260px; }
  .card.land-amber { animation: land-amber 0.7s ease-out; }
  .card.leaving { transition: opacity 0.18s ease-out, transform 0.18s ease-out; opacity: 0; transform: scale(0.96); pointer-events: none; }
  .card .open { all: unset; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%; cursor: pointer; }
  .card .open:focus-visible { outline: 2px solid var(--fog); outline-offset: 2px; border-radius: 3px; }
  .card .title { font-size: 13.5px; font-weight: 590; letter-spacing: -0.012em; color: var(--paper); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .amount { font-size: 13.5px; font-weight: 590; color: var(--paper); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .card .tag { color: var(--ash); font-size: 10.5px; font-family: var(--mono); white-space: nowrap; margin-left: auto; }
  .card .steps { display: flex; align-items: center; gap: 8px; margin-top: 5px; min-width: 0; }
  .card .steps .dots { display: inline-flex; gap: 4px; flex: none; }
  .card .step { width: 7px; height: 7px; border-radius: 50%; background: var(--smoke); transition: background 0.2s; }
  .card .step[data-status="active"] { background: var(--mist); }
  .card .step[data-status="sent"] { background: var(--green); }
  .card .step[data-status="held"] { background: var(--amber); }
  .card .step[data-status="blocked"] { background: var(--amber); opacity: 0.45; }
  .card .step[data-status="discarded"], .card .step[data-status="skipped"] { background: var(--red); }
  .card .steps .names { color: var(--fog); font-size: 11.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .flag { margin-top: 6px; padding: 0 0 0 8px; border-left: 2px solid var(--amber); color: var(--amber); font-size: 12.5px; font-weight: 510; line-height: 1.35; }
  .col[data-col="complete"] .card .flag { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .foot { display: flex; gap: 8px; align-items: baseline; margin-top: 6px; flex-wrap: wrap; font-size: 12px; min-height: 18px; }
  .card .foot .st { color: var(--fog); }
  .card .foot .st.green { color: var(--green); }
  .card .foot .st.red { color: var(--red); }
  .card .foot .st.amber { color: var(--amber); }
  .card .foot .ids { color: var(--ash); font-family: var(--mono); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .card .foot .btn.small { padding: 2px 8px; font-size: 12px; }
  /* the rule card and the queued-run card share the frame */
  .card[data-kind="rule"] { border-left-color: var(--amber); }
  .card[data-kind="rule"].on { border-left-color: var(--green); }
  .card[data-kind="rule"].on:hover { border-left-color: var(--green); }
  .card[data-kind="rule"] .diff { margin-top: 6px; display: grid; gap: 4px; }
  .card[data-kind="rule"] .rule-q { margin-top: 6px; color: var(--amber); font-size: 12.5px; font-weight: 510; }
  .card[data-kind="rule"].on .rule-q { color: var(--mist); }
  .card[data-kind="job"] { cursor: default; border-left-color: var(--smoke); }
  .card[data-kind="job"] .open { cursor: default; }
  .card[data-kind="job"] .title { white-space: normal; color: var(--mist); font-weight: 510; }
  .card[data-kind="job"] .foot .st::after { content: "…"; animation: pulse 0.9s ease-in-out infinite; }
  .diff .side { background: var(--void); border: 1px solid var(--graphite); border-radius: var(--r-tile); padding: 6px 9px; font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--mist); }
  .diff .side .lab { display: block; font-family: var(--mono); font-size: 10px; color: var(--ash); margin-bottom: 2px; }
  .diff del { background: var(--red-wash); color: var(--red); text-decoration: line-through; border-radius: 2px; padding: 0 2px; }
  .diff .side.after { border-left: 2px solid var(--green); }

  /* ---- the rule popup: what you took out, first; then the rule in your words ---- */
  .catch { margin: 12px 0 2px; padding: 12px 14px 11px; border-left: 3px solid var(--amber); background: var(--amber-wash); border-radius: 0 var(--r-tile) var(--r-tile) 0; }
  .catch .catch-line { color: var(--paper); font-size: 15px; font-weight: 510; line-height: 1.4; letter-spacing: -0.01em; }
  .frag { margin-top: 8px; padding: 9px 12px; background: var(--void); border: 1px solid var(--graphite); border-radius: var(--r-tile); color: var(--mist); font-size: 15px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .frag .lab { display: block; font-family: var(--mono); font-size: 10px; color: var(--ash); margin-bottom: 2px; }
  .frag mark { color: var(--amber); font-weight: 590; background: var(--amber-wash); box-shadow: inset 0 0 0 1px rgba(240, 177, 61, 0.55); padding: 0 3px; }
  .catch .catch-why { margin-top: 8px; color: var(--fog); font-size: 12.5px; line-height: 1.45; }
  .catch .catch-why code { color: var(--mist); }
  .catch details.whole { margin-top: 8px; }
  .catch details.whole summary { color: var(--ash); font-size: 11.5px; cursor: pointer; }
  .catch details.whole summary:hover { color: var(--fog); }
  .catch details.whole .diff { margin-top: 6px; }
  .rule-words textarea { display: block; font-family: var(--sans); font-size: 14.5px; line-height: 1.4; background: var(--obsidian); color: var(--paper); border: 1px solid var(--graphite); border-radius: var(--r-tile); padding: 9px 12px; width: 100%; resize: vertical; min-height: 44px; }
  .rule-words textarea:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-wash); }
  .rule-words textarea[readonly] { color: var(--mist); }
  .readback { margin-top: 7px; font-size: 13px; line-height: 1.45; color: var(--mist); min-height: 20px; transition: opacity 0.15s; }
  .readback.pending { opacity: 0.55; }
  .readback .rb { display: block; }
  .readback .rb b { color: var(--paper); }
  .readback .rb.bad { color: var(--amber); font-weight: 510; }
  .readback .rb-note { display: block; color: var(--fog); font-size: 12.5px; margin-top: 2px; }
  .chips { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--ash); font-size: 11.5px; }
  .card .frag.small { font-size: 12.5px; line-height: 1.4; padding: 5px 8px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .frag.small .lab { margin-bottom: 0; }

  /* ---- the popup: native dialog, blurred backdrop, smooth in and out ---- */
  dialog#detail { border: 1px solid var(--graphite); border-radius: var(--r-card); background: var(--carbon); color: var(--mist); padding: 0; width: min(720px, 94vw); max-height: 88vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
  dialog#detail:not([open]) { display: none; }
  dialog#detail[open] { opacity: 1; transform: none; transition: opacity 0.22s ease-out, transform 0.22s cubic-bezier(0.2, 0.7, 0.2, 1); }
  @starting-style { dialog#detail[open] { opacity: 0; transform: translateY(8px) scale(0.98); } }
  dialog#detail.closing { opacity: 0; transform: translateY(6px) scale(0.985); transition: opacity 0.16s ease-in, transform 0.16s ease-in; }
  dialog#detail::backdrop { background: rgba(8, 9, 10, 0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity 0.22s ease-out; }
  @starting-style { dialog#detail[open]::backdrop { opacity: 0; } }
  dialog#detail.closing::backdrop { opacity: 0; transition: opacity 0.16s ease-in; }
  .dlg-head { display: flex; align-items: baseline; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--graphite); flex-wrap: wrap; }
  .dlg-head .title { font-size: 18px; font-weight: 590; letter-spacing: -0.015em; color: var(--paper); }
  .dlg-head .amount { font-size: 18px; font-weight: 590; color: var(--paper); font-variant-numeric: tabular-nums; }
  .dlg-head .meta { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; color: var(--fog); font-size: 12.5px; }
  .dlg-head .close { all: unset; margin-left: auto; cursor: pointer; color: var(--fog); font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: var(--r-btn); align-self: center; }
  .dlg-head .close:hover { color: var(--paper); background: var(--obsidian); }
  .dlg-head .close:focus-visible { outline: 2px solid var(--fog); }
  .dlg-body { overflow: auto; overscroll-behavior: contain; padding: 4px 18px 16px; }
  .dlg-body h3 { margin: 16px 0 8px; font-size: 11px; font-weight: 590; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ash); }
  .dlg-actions { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--graphite); flex-wrap: wrap; background: var(--carbon); }
  .dlg-actions .btn { padding: 8px 16px; font-size: 13.5px; }
  .dlg-actions .note { color: var(--fog); font-size: 12.5px; flex-basis: 100%; }
  .dlg-actions .note.green { color: var(--green); }
  /* why it's held: the reason, then what the agent wants against what is on record */
  .why { margin: 0 0 10px; }
  .why .reason { color: var(--amber); font-size: 14px; font-weight: 510; line-height: 1.4; }
  .why .reason.muted { color: var(--fog); font-weight: 400; }
  .cmp { margin-top: 8px; border: 1px solid var(--graphite); border-radius: var(--r-tile); overflow: hidden; font-size: 13px; }
  .cmp .row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px; padding: 7px 10px; align-items: baseline; }
  .cmp .row + .row { border-top: 1px solid var(--graphite); }
  .cmp .row .lab { color: var(--fog); font-size: 12px; }
  .cmp .row .val { color: var(--paper); font-weight: 510; overflow-wrap: anywhere; }
  .cmp .row .val.text { font-weight: 400; color: var(--mist); white-space: pre-wrap; }
  .cmp .row.bad { background: var(--red-wash); }
  .cmp .row.bad .val code { color: var(--red); }
  .cmp .row.good { background: var(--green-wash); }
  .cmp .row.good .val code { color: var(--green); }
  /* what the agent wants to do: numbered steps, each a small table of fields */
  .stp { border-top: 1px solid var(--graphite); padding: 10px 0 8px; }
  .stp:first-of-type { border-top: 0; }
  .stp .sh { display: flex; align-items: baseline; gap: 10px; font-size: 13.5px; }
  .stp .sh .n { color: var(--ash); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 14px; }
  .stp .sh .tool { color: var(--paper); font-weight: 590; }
  .stp .sh .st { color: var(--fog); font-size: 12px; }
  .stp .sh .st.green { color: var(--green); }
  .stp .sh .st.amber { color: var(--amber); }
  .stp .sh .st.red { color: var(--red); }
  .stp .sh .spacer { flex: 1; }
  .fields { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 3px 12px; margin: 6px 0 0 24px; font-size: 13px; }
  .fields dt { color: var(--fog); }
  .fields dd { margin: 0; color: var(--mist); overflow-wrap: anywhere; white-space: pre-wrap; }
  .fields dd .num { font-variant-numeric: tabular-nums; }
  .fields dd .ph, .edit .ph { color: var(--amber); font-style: normal; }
  .fields dd code.real { color: var(--green); }
  .edit { display: grid; gap: 6px; margin: 6px 0 0 24px; }
  .edit label { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 13px; color: var(--fog); }
  .edit input, .edit textarea, .sheet input, .sheet textarea, .sheet select, .cset input, .cset textarea, .rule-form input, .rule-form select {
    font-family: var(--sans); font-size: 13px; background: var(--obsidian); color: var(--mist); border: 1px solid var(--graphite); border-radius: var(--r-btn); padding: 6px 9px; min-width: 0; width: 100%;
  }
  .edit input:focus, .edit textarea:focus, .sheet input:focus, .sheet textarea:focus, .sheet select:focus, .cset input:focus, .cset textarea:focus, .rule-form input:focus, .rule-form select:focus { outline: none; border-color: var(--smoke); }
  .stp .note { margin: 6px 0 0 24px; }
  .stp .raw { margin: 6px 0 0 24px; }
  .stp .raw summary { color: var(--ash); font-size: 11.5px; cursor: pointer; }
  .stp .raw pre { margin: 6px 0 0; background: var(--void); border: 1px solid var(--graphite); border-radius: var(--r-tile); padding: 8px 10px; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: var(--fog); }
  .dlg-body .diff { display: grid; gap: 4px; }
  /* the sheets: a job, the rules, the connectors */
  .sheet { display: flex; flex-direction: column; min-height: 0; }
  .sheet .block, .cset .block { display: grid; gap: 4px; padding: 10px 18px 0; }
  .sheet .block > span, .cset .block > span, .sheet legend { color: var(--fog); font-size: 12.5px; }
  .sheet fieldset { border: 0; margin: 0; }
  .sheet .row { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; font-size: 13.5px; }
  .sheet .row input { width: auto; }
  .sheet .row .cn { color: var(--paper); font-weight: 510; }
  .sheet .row .hint { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .err { padding: 0 18px; }
  .rule { padding: 8px 0; border-top: 1px solid var(--graphite); }
  .rule:first-of-type { border-top: 0; }
  .rule .rs { color: var(--paper); font-size: 13.5px; font-weight: 510; }
  .rule .ro { color: var(--fog); font-size: 12px; margin-top: 1px; }
  .rule .ra, .cset .ra { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .rule-form { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr) auto; gap: 6px; align-items: center; margin-top: 4px; }
  .rule-form .lab { color: var(--fog); font-size: 12.5px; }
  .rule-form .err { grid-column: 1 / -1; }
  .dlg-body .hint { margin-top: 8px; }
  .conn { padding: 10px 0; border-top: 1px solid var(--graphite); }
  .conn:first-of-type { border-top: 0; }
  .conn .ch { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .conn .ch .cn { color: var(--paper); font-weight: 590; font-size: 14px; }
  .conn .cd { color: var(--fog); font-size: 13px; margin-top: 2px; }
  .conn .ct { color: var(--fog); font-size: 12.5px; margin-top: 2px; }
  .conn details { margin-top: 6px; }
  .conn summary { color: var(--mist); font-size: 12.5px; cursor: pointer; }
  .cset { display: grid; gap: 6px; margin-top: 6px; }
  .cset .block { padding: 0; }

  /* the montage's learned panel and the learning screen */
  .learned .lh { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ash); margin: 0 0 3px; padding-top: 14px; border-top: 1px solid var(--graphite); }
  #learned-ladder .lh:first-child { padding-top: 2px; border-top: 0; }
  .learned .lh .n { color: var(--fog); font-size: 11px; }
  .learned .lrow { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 4px 0; font-size: 13px; }
  .learned .lrow .ln { color: var(--mist); font-weight: 510; min-width: 0; overflow-wrap: anywhere; }
  .learned .lrow .lm { color: var(--ash); font-size: 11px; white-space: nowrap; }
  .learned .lrule { padding: 5px 0; font-size: 13px; }
  .learned .lrule .ln { color: var(--mist); font-weight: 510; }
  .learned .lrule .lm { color: var(--ash); font-size: 11px; margin-top: 2px; }
  .learned .events { max-height: min(440px, calc(100vh - 460px)); overflow: auto; }
  .learned .evg { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 10px; padding: 7px 0; border-top: 1px solid var(--graphite); }
  .learned .evg:first-child { border-top: 0; padding-top: 2px; }
  .learned .evg .evk { color: var(--ash); font-size: 11px; padding-top: 2px; }
  .learned .ev { font-size: 13px; padding: 1px 0; animation: fade 0.3s ease-out; }
  .learned .ev.promotion { color: var(--green); font-weight: 510; }
  .learned .ev.rule { color: var(--amber); }
  .learned .ents { margin-top: 10px; display: grid; }
  .ent { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 5px 0; border-top: 1px solid var(--graphite); flex-wrap: wrap; }
  .ent .nm { font-weight: 510; }
  .ent .rg { color: var(--fog); }
  .notice { margin-bottom: 12px; padding: 7px 12px; border-radius: var(--r-tile); background: var(--amber-wash); font-size: 13px; font-weight: 510; }
  .empty { color: var(--fog); font-size: 13px; }
  .charts { display: flex; flex-direction: column; gap: 12px; }
  .chart-box { position: relative; }

  footer { padding: 12px var(--pad-x) 16px; border-top: 1px solid var(--graphite); color: var(--ash); font-size: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @keyframes card-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes land-amber { 0% { box-shadow: 0 0 0 0 rgba(240, 177, 61, 0.55); } 100% { box-shadow: 0 0 0 10px rgba(240, 177, 61, 0); } }
  @keyframes colflash { 0% { background: var(--amber-wash); } 100% { background: transparent; } }

  #colnav { display: none; flex: none; }

  @media (max-width: 1100px) {
    #job-form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    #job-form .prompt { grid-column: 1 / -1; }
    #colnav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 0 0 10px; }
    #colnav .btn { min-height: 44px; padding: 4px 6px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.2; }
    #colnav .btn .n { font-size: 14px; font-weight: 590; color: var(--paper); font-variant-numeric: tabular-nums; }
    #colnav .btn.amber-n .n { color: var(--amber); }
    #board { display: grid; grid-auto-flow: column; grid-auto-columns: 86vw; grid-template-columns: none; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; min-height: 420px; padding-bottom: 4px; }
    .col { scroll-snap-align: start; }
    .cmp .row, .fields, .edit label { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
    .rule-form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .rule-form .lab { display: none; }
  }
  @media (max-width: 820px) {
    header { grid-template-columns: 1fr auto; padding: 0 16px; row-gap: 0; }
    nav { grid-row: 2; grid-column: 1 / -1; justify-self: stretch; overflow-x: auto; }
    nav .btn { padding: 10px; min-height: 44px; }
    nav .btn.active::after { bottom: 0; }
    .tools { flex-wrap: wrap; justify-content: flex-end; padding: 6px 0; }
    main { padding: 12px 16px 20px; }
    footer { padding: 12px 16px; }
    .cols { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .card .foot .btn.small { min-height: 34px; }
    dialog#detail { width: 96vw; max-height: 92vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .card.enter, .card.leaving, .chip, .learned .ev, .col.flash .col-head { animation: none !important; transition: none !important; }
    .card.land-amber { animation: none !important; }
    .card[data-kind="job"] .foot .st::after { animation: none; }
    dialog#detail[open], dialog#detail.closing, dialog#detail::backdrop { transition: none !important; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"></span><span class="name">pakka</span><span class="sub" id="sub"></span></div>
    <nav>
      <button class="btn" id="b-board" data-action="board" disabled>Board</button>
      <button class="btn" id="b-learn" data-action="learning" disabled>Learning</button>
    </nav>
    <div class="tools">
      <button class="btn" id="b-rules" data-action="rules" disabled>Rules</button>
      <button class="btn" id="b-settings" data-action="settings" disabled>Settings</button>
      <button class="btn ghost" id="b-reset" data-action="reset" disabled>Reset</button>
    </div>

  <main id="main"></main>

</body>
