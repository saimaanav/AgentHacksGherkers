<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pakka</title>
<link rel="icon" href="data:,">
<style>
  /* Linear-derived: near-black surface ladder, hairline dividers, hierarchy from
     type weight rather than boxes. Amber/green/red are the only hue and mean state.
     Fonts are vendored in web/fonts/ (sources and hashes in its README); no CDN. */
  @font-face {
    font-family: InterVariable;
    src: url(/web/fonts/InterVariable.woff2) format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url(/web/fonts/JetBrainsMono-Regular.woff2) format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --void: #08090a;
    --carbon: #0f1011;
    --obsidian: #161718;
    --graphite: #23252a;
    --smoke: #383b3f;
    --ash: #62666d;
    --fog: #8a8f98;
    --mist: #d0d6e0;
    --paper: #ffffff;
    --amber: #f0b13d;   --amber-wash: rgba(240, 177, 61, 0.07);
    --green: #3fb950;   --green-wash: rgba(63, 185, 80, 0.08);
    --red: #eb5757;     --red-wash: rgba(235, 87, 87, 0.10);
    --r-card: 12px; --r-tile: 6px; --r-btn: 6px;
    --pad-x: max(24px, calc((100vw - 1400px) / 2));
    --sans: InterVariable, "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Berkeley Mono", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --move: 320ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--graphite) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--graphite); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--smoke); }
  :focus-visible { outline: 2px solid var(--fog); outline-offset: 1px; }
  html, body { margin: 0; padding: 0; background: var(--void); color: var(--mist); }
  body {
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    font-feature-settings: "cv01", "ss03", "zero";
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  body.locked { overflow: hidden; }
  button { font: inherit; }
  b, strong { font-weight: 590; } /* the system caps at 590; never synthetic 700 */
  code, .mono { font-family: var(--mono); font-size: 0.9em; letter-spacing: 0; }

  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; column-gap: 16px;
    padding: 0 var(--pad-x); min-height: 52px; border-bottom: 1px solid var(--graphite);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { display: inline-flex; align-items: center; gap: 3px; }
  .mark::before, .mark::after { content: ""; width: 3px; height: 11px; background: var(--paper); border-radius: 1px; }
  .brand .name { font-size: 15px; font-weight: 590; letter-spacing: -0.01em; color: var(--paper); }
  .brand .sub { color: var(--fog); font-size: 13px; }
  .brand .sub:not(:empty)::before { content: "/"; color: var(--smoke); margin-right: 10px; }
  nav { display: flex; align-items: stretch; justify-self: center; }
  .tools { display: flex; align-items: center; gap: 8px; justify-self: end; }
  .btn {
    background: transparent; color: var(--mist); border: 1px solid var(--graphite); border-radius: var(--r-btn);
    padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 510; line-height: 1.3;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .btn:hover { background: var(--obsidian); border-color: var(--smoke); color: var(--paper); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--paper); color: var(--void); border-color: var(--paper); font-weight: 590; }
  .btn.primary:hover { background: var(--mist); }
  .btn.amber { background: var(--amber); color: #151003; border-color: var(--amber); font-weight: 590; }
  .btn.amber:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--red); border-color: rgba(235, 87, 87, 0.35); }
  .btn.danger:hover { background: var(--red-wash); border-color: rgba(235, 87, 87, 0.6); color: var(--red); }
  .btn.ghost { border-color: transparent; color: var(--fog); }
  .btn.small { padding: 3px 9px; font-size: 12.5px; }
  nav .btn { border: 0; border-radius: 0; background: transparent; color: var(--fog); padding: 0 14px; position: relative; }
  nav .btn:hover { background: transparent; color: var(--paper); }
  nav .btn.active { color: var(--paper); }
  nav .btn.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--paper); border-radius: 1px; }
  nav .btn:disabled { opacity: 0.35; }
  .btn .count { margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--amber-wash); color: var(--amber); font-size: 11px; font-weight: 590; font-variant-numeric: tabular-nums; }
  .tools .btn { border: 1px solid var(--graphite); border-radius: var(--r-btn); color: var(--fog); padding: 5px 12px; }
  .tools .btn:hover { border-color: var(--smoke); color: var(--paper); background: transparent; }

  main { flex: 1; padding: 16px var(--pad-x) 20px; width: 100%; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .panel { background: var(--carbon); border: 1px solid var(--graphite); border-radius: var(--r-card); padding: 14px 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; font-weight: 510; color: var(--fog); }
  .muted { color: var(--fog); }
  .amber { color: var(--amber); }
  .green { color: var(--green); }
  .red { color: var(--red); }

  /* ---- above the board: the agent's last line, the phase counters, what it has learned ---- */
  .strip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: end; padding: 4px 0 12px; flex: none; }
  #hero .label { font-size: 12px; color: var(--fog); margin-bottom: 4px; }
  #hero .line { font-size: 26px; font-weight: 590; letter-spacing: -0.02em; line-height: 1.15; margin: 0; color: var(--paper); overflow-wrap: anywhere; transition: font-size 0.25s ease-out; }
  .strip.opening { padding: 22px 0 16px; }
  .strip.opening #hero .line { font-size: 42px; letter-spacing: -0.022em; line-height: 1.05; }
  .strip.opening #hero .after { margin-top: 10px; font-size: 14px; }
  .strip.opening #counters { display: none; }
  #counters.no-score .counter.score { display: none; }
  #hero .line.running { color: var(--fog); font-weight: 510; }
  #hero .after { margin-top: 4px; color: var(--fog); font-size: 13px; }
  #hero .after b { color: var(--paper); font-weight: 590; }
  #counters { display: flex; align-items: stretch; background: var(--carbon); border: 1px solid var(--graphite); border-radius: var(--r-card); overflow: hidden; }
  .counter { padding: 8px 14px; border-left: 1px solid var(--graphite); min-width: 84px; }
  .counter:first-child { border-left: 0; }
  .counter .n { font-size: 19px; font-weight: 590; line-height: 1.15; letter-spacing: -0.02em; color: var(--paper); font-variant-numeric: tabular-nums; }
  .counter .l { color: var(--fog); font-size: 11px; margin-top: 1px; white-space: nowrap; }
  .counter.held .n { color: var(--amber); }
  .counter.through .n { color: var(--green); }
  .counter.score { display: flex; flex-direction: column; justify-content: center; }
  .counter.score .n { font-size: 14px; }
  .counter.score .ok { color: var(--green); }
  .counter.score .bad { color: var(--red); }
  .counter .phase { color: var(--ash); font-size: 11px; }
  #learned-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: none; margin: -4px 0 10px; font-size: 12.5px; color: var(--fog); }
  #learned-bar .lb-title { color: var(--ash); font-size: 12px; margin-right: 2px; }
  #learned-bar .latest { color: var(--mist); animation: fade 0.3s ease-out; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #learned-bar .latest.promotion { color: var(--green); }
  #learned-bar .latest.rule { color: var(--amber); }
  #learned-bar .empty { color: var(--ash); }
  #learned-bar .btn { margin-left: auto; }
  #rule-slot { flex: none; }
  #rule-slot:empty { display: none; }
  .chip { font-size: 11.5px; line-height: 1.5; padding: 1px 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.04); color: var(--fog); animation: pop 0.25s ease-out; }
  .chip.sent, .chip.released { color: var(--green); background: var(--green-wash); }
  .chip.held { background: var(--amber-wash); color: var(--amber); }

  /* ---- the board ---- */
  #board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; flex: 1; min-height: 360px; }
  #board.with-rail { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr) minmax(240px, 280px); }
  #rail { min-height: 0; overflow: auto; }
  #rail .panel { border-radius: var(--r-card); }
  #rail .learned .events { max-height: none; }
  .col { display: flex; flex-direction: column; min-height: 0; background: var(--carbon); border: 1px solid var(--graphite); border-radius: var(--r-card); position: relative; }
  .col::before { content: ""; position: absolute; left: 12px; right: 12px; top: 0; height: 2px; background: transparent; border-radius: 0 0 2px 2px; }
  .col[data-col="needs_approval"]::before { background: var(--amber); }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--graphite); flex-wrap: wrap; }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 590; color: var(--mist); letter-spacing: -0.005em; }
  .col[data-col="needs_approval"] .col-head h2 { color: var(--paper); }
  .col-head .count { padding: 0 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.05); color: var(--fog); font-size: 11px; font-weight: 590; font-variant-numeric: tabular-nums; min-width: 20px; text-align: center; line-height: 18px; }
  .col[data-col="needs_approval"] .col-head .count { background: var(--amber-wash); color: var(--amber); font-size: 13px; line-height: 20px; }
  .col[data-col="complete"] .col-head .count { background: var(--green-wash); color: var(--green); }
  .col[data-col="in_progress"] .col-head .count:not(.zero) { color: var(--mist); }
  .col-head .sum { flex-basis: 100%; color: var(--fog); font-size: 12px; margin-top: 2px; }
  .col-head .sum b { color: var(--paper); font-weight: 590; }
  .col-head .sum .amber { color: var(--amber); }
  .col-head .act { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .col-head .banner { color: var(--green); font-size: 12px; font-weight: 510; flex-basis: 100%; }
  .col.flash .col-head { animation: colflash 0.9s ease-out; }
  .col-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overflow-anchor: none; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .col-body .empty { color: var(--ash); font-size: 12.5px; padding: 6px 4px; }
  .col-body .group { color: var(--fog); font-size: 11.5px; font-weight: 510; padding: 6px 4px 0; display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--graphite); margin-top: 2px; }
  .col-body .group:first-child { border-top: 0; margin-top: 0; padding-top: 2px; }
  .col-body .group .g-n { color: var(--ash); font-variant-numeric: tabular-nums; }

  /* cards: one persistent element per chain; content patched in place, moved with FLIP */
  .card { background: var(--obsidian); border: 1px solid var(--graphite); border-radius: 8px; padding: 9px 11px 9px 10px; border-left: 2px solid transparent; position: relative; cursor: pointer; }
  .card.enter { animation: card-in 0.3s ease-out; }
  .card.ghost { position: fixed; margin: 0; pointer-events: none; will-change: transform; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); }
  #ghosts { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  .card:hover { border-color: var(--smoke); border-left-color: var(--smoke); }
  .card.flagged { border-left-color: var(--amber); }
  .card.flagged:hover { border-left-color: var(--amber); }
  .card.discarded { opacity: 0.45; }
  .card.discarded .open .title { text-decoration: line-through; }
  .card.land-amber { animation: land-amber 0.7s ease-out; }
  .card.leaving { transition: opacity 0.18s ease-out, transform 0.18s ease-out; opacity: 0; transform: scale(0.96); pointer-events: none; }
  .card .open { all: unset; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%; cursor: pointer; }
  .card .open:focus-visible { outline: 2px solid var(--fog); outline-offset: 2px; border-radius: 3px; }
  .card .title { font-size: 13.5px; font-weight: 590; letter-spacing: -0.012em; color: var(--paper); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .amount { font-size: 13.5px; font-weight: 590; color: var(--paper); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .card .tag { color: var(--ash); font-size: 10.5px; font-family: var(--mono); white-space: nowrap; }
  .card .members { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-top: 5px; }
  .member { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--fog); white-space: nowrap; }
  .member::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--smoke); flex: none; transition: background 0.2s; }
  .member[data-status="active"]::before { background: var(--mist); }
  .member[data-status="sent"]::before { background: var(--green); }
  .member[data-status="held"]::before { background: var(--amber); }
  .member[data-status="blocked"]::before { background: var(--amber); opacity: 0.45; }
  .member[data-status="discarded"]::before, .member[data-status="skipped"]::before { background: var(--red); }
  .member[data-status="will-skip"]::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--red); }
  .member[data-status="will-skip"] { color: var(--red); opacity: 0.8; }
  .member .rid { color: var(--green); margin-left: 2px; }
  .member[data-status="sent"] { color: var(--mist); }
  .member[data-status="held"] { color: var(--amber); }
  .card .flag { margin-top: 6px; padding: 0 0 0 8px; border-left: 2px solid var(--amber); color: var(--amber); font-size: 12.5px; font-weight: 510; line-height: 1.35; }
  .col[data-col="complete"] .card .flag { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .why { margin-top: 6px; color: var(--fog); font-size: 12px; }
  .card .flag .kind { font-size: 9.5px; font-weight: 590; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.7; margin-right: 6px; }
  .card .foot { display: flex; gap: 6px; align-items: center; margin-top: 7px; flex-wrap: wrap; font-size: 12px; min-height: 18px; }
  .card .foot .badge { color: var(--fog); }
  .card .foot .badge.green { color: var(--green); }
  .card .foot .badge.red { color: var(--red); }
  .card .foot .badge.amber { color: var(--amber); }
  .card .foot .ids { color: var(--ash); font-family: var(--mono); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .card .foot .note { color: var(--fog); font-size: 11.5px; }
  .card .foot .btn.small { padding: 2px 8px; font-size: 12px; }
  .card .foot .spacer { flex: 1; }
  /* the rule card and the queued-run card share the frame */
  .card[data-kind="rule"] { border-left-color: var(--amber); }
  .card[data-kind="rule"] .diff { margin-top: 6px; display: grid; gap: 4px; }
  .card[data-kind="rule"] .rule-q { margin-top: 6px; color: var(--amber); font-size: 12.5px; font-weight: 510; }
  .card[data-kind="rule"] .rule-q b { color: var(--amber); }
  .card[data-kind="queued"] { padding: 7px 10px; cursor: default; background: transparent; border-style: dashed; }
  .card[data-kind="queued"] .title { color: var(--fog); font-weight: 510; font-size: 12.5px; }
  .card[data-kind="queued"] .open { cursor: default; }
  .card[data-kind="queued"].running { border-style: solid; background: var(--obsidian); }
  .card[data-kind="queued"].running .title { color: var(--mist); }
  .card[data-kind="queued"].running .title::after { content: "…"; animation: pulse 0.9s ease-in-out infinite; }
  .card[data-kind="queued"] .modetag { color: var(--ash); font-size: 10.5px; font-family: var(--mono); }
  .more { color: var(--ash); font-size: 12px; padding: 4px 4px 0; }
  .diff .side { background: var(--void); border: 1px solid var(--graphite); border-radius: var(--r-tile); padding: 6px 9px; font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--mist); }
  .diff .side .lab { display: block; font-family: var(--mono); font-size: 10px; color: var(--ash); margin-bottom: 2px; }
  .diff del { background: var(--red-wash); color: var(--red); text-decoration: line-through; border-radius: 2px; padding: 0 2px; }
  .diff .side.after { border-left: 2px solid var(--green); }

  /* ---- the popup: native dialog, blurred backdrop, smooth in and out ---- */
  dialog#detail { border: 1px solid var(--graphite); border-radius: var(--r-card); background: var(--carbon); color: var(--mist); padding: 0; width: min(760px, 94vw); max-height: 86vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
  dialog#detail:not([open]) { display: none; }
  dialog#detail[open] { opacity: 1; transform: none; transition: opacity 0.22s ease-out, transform 0.22s cubic-bezier(0.2, 0.7, 0.2, 1); }
  @starting-style { dialog#detail[open] { opacity: 0; transform: translateY(8px) scale(0.98); } }
  dialog#detail.closing { opacity: 0; transform: translateY(6px) scale(0.985); transition: opacity 0.16s ease-in, transform 0.16s ease-in; }
  dialog#detail::backdrop { background: rgba(8, 9, 10, 0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity 0.22s ease-out; }
  @starting-style { dialog#detail[open]::backdrop { opacity: 0; } }
  dialog#detail.closing::backdrop { opacity: 0; transition: opacity 0.16s ease-in; }
  .dlg-head { display: flex; align-items: baseline; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--graphite); flex-wrap: wrap; }
  .dlg-head .title { font-size: 17px; font-weight: 590; letter-spacing: -0.015em; color: var(--paper); }
  .dlg-head .amount { font-size: 17px; font-weight: 590; color: var(--paper); font-variant-numeric: tabular-nums; }
  .dlg-head .meta { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; color: var(--fog); font-size: 12.5px; }
  .dlg-head .meta .mono { color: var(--ash); font-size: 11px; }
  .dlg-head .close { all: unset; margin-left: auto; cursor: pointer; color: var(--fog); font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: var(--r-btn); align-self: center; }
  .dlg-head .close:hover { color: var(--paper); background: var(--obsidian); }
  .dlg-head .close:focus-visible { outline: 2px solid var(--fog); }
  .dlg-head .ctx { flex-basis: 100%; color: var(--fog); font-size: 12.5px; margin-top: -4px; }
  .dlg-head .ctx:empty { display: none; }
  .dlg-body { overflow: auto; overscroll-behavior: contain; padding: 8px 18px 18px; }
  .dlg-body h3 { margin: 14px 0 6px; font-size: 11px; font-weight: 590; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ash); }
  .dlg-body .flagline { padding: 4px 0 4px 10px; border-left: 2px solid var(--amber); color: var(--amber); font-size: 13.5px; font-weight: 510; margin: 4px 0; }
  .dlg-body .flagline .kind { font-size: 10px; font-weight: 590; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.7; margin-right: 8px; }
  .dlg-body .flagline .detail { display: block; color: var(--fog); font-weight: 400; font-size: 12.5px; margin-top: 2px; }
  .dlg-body .flagline .detail code { color: var(--mist); }
  .dlg-body .w { border-top: 1px solid var(--graphite); padding: 10px 0; }
  .dlg-body .w:first-of-type { border-top: 0; }
  .dlg-body .w .wh { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; font-size: 13px; }
  .dlg-body .w .wh .tool { color: var(--paper); font-weight: 590; }
  .dlg-body .w .wh .ph { color: var(--ash); font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlg-body .w .wh .st { font-family: var(--mono); font-size: 11.5px; color: var(--fog); white-space: nowrap; }
  .dlg-body .w .wh .st.sent { color: var(--green); }
  .dlg-body .w .wh .st.held { color: var(--amber); }
  .dlg-body .w .wh .st.red { color: var(--red); }
  .dlg-body .w .by { color: var(--ash); font-size: 11.5px; margin-top: 1px; }
  .dlg-body pre { margin: 6px 0 0; background: var(--void); border: 1px solid var(--graphite); border-radius: var(--r-tile); padding: 8px 10px; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: var(--fog); }
  .dlg-body pre .ph { color: var(--amber); }
  .dlg-body pre .real { color: var(--green); }
  .dlg-body .diff { display: grid; gap: 4px; margin-top: 6px; }
  .dlg-body .kv { color: var(--fog); font-size: 12.5px; }
  .dlg-body .kv code { color: var(--mist); }
  .dlg-body .kv .list { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .dlg-actions { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--graphite); flex-wrap: wrap; }
  .dlg-actions .note { color: var(--fog); font-size: 12.5px; }

  /* the montage's learned panel and the learning screen: unchanged */
  .learned .lh { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ash); margin: 0 0 3px; padding-top: 14px; border-top: 1px solid var(--graphite); }
  #learned-ladder .lh:first-child { padding-top: 2px; border-top: 0; }
  .learned .lh .n { color: var(--fog); font-size: 11px; }
  .learned .lrow { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 4px 0; font-size: 13px; }
  .learned .lrow .ln { color: var(--mist); font-weight: 510; min-width: 0; overflow-wrap: anywhere; }
  .learned .lrow .lm { color: var(--ash); font-size: 11px; white-space: nowrap; }
  .learned .lrule { padding: 5px 0; font-size: 13px; }
  .learned .lrule .ln { color: var(--mist); font-weight: 510; }
  .learned .lrule .lm { color: var(--ash); font-size: 11px; margin-top: 2px; }
  .learned .events { max-height: min(440px, calc(100vh - 460px)); overflow: auto; }
  .learned .evg { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 10px; padding: 7px 0; border-top: 1px solid var(--graphite); }
  .learned .evg:first-child { border-top: 0; padding-top: 2px; }
  .learned .evg .evk { color: var(--ash); font-size: 11px; padding-top: 2px; }
  .learned .ev { font-size: 13px; padding: 1px 0; animation: fade 0.3s ease-out; }
  .learned .ev.promotion { color: var(--green); font-weight: 510; }
  .learned .ev.rule { color: var(--amber); }
  .learned .ents { margin-top: 10px; display: grid; }
  .ent { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 5px 0; border-top: 1px solid var(--graphite); flex-wrap: wrap; }
  .ent .nm { font-weight: 510; }
  .ent .rg { color: var(--fog); }
  .ladder { margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 4px; min-height: 24px; }
  .ladder .chip { animation: none; }

  /* a typed rule (Q&A), a one-line notice */
  .rule-form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--graphite); }
  #rule-slot .rule-form { margin: 0 0 10px; padding: 8px 12px; border: 1px solid var(--graphite); border-radius: var(--r-tile); background: var(--carbon); }
  .rule-form .lab { color: var(--fog); font-size: 12px; }
  .rule-form .muted { font-size: 12px; }
  .rule-form select, .rule-form input {
    font-family: var(--sans); font-size: 12.5px; font-weight: 400; background: var(--obsidian); color: var(--mist); border: 1px solid var(--graphite); border-radius: var(--r-btn); padding: 5px 8px; min-width: 0;
  }
  .rule-form select:focus, .rule-form input:focus { outline: none; border-color: var(--smoke); }
  .rule-form select { max-width: 11em; }
  .rule-form input { flex: 1; min-width: 6em; }
  .rule-form .rule-err { width: 100%; font-size: 12px; font-weight: 510; }
  .notice { margin-bottom: 12px; padding: 7px 12px; border-radius: var(--r-tile); background: var(--amber-wash); font-size: 13px; font-weight: 510; }
  .empty { color: var(--fog); font-size: 13px; }

  /* learning tab: Chart.js canvases in fixed-height boxes */
  .charts { display: flex; flex-direction: column; gap: 12px; }
  .chart-box { position: relative; }

  footer { padding: 12px var(--pad-x) 16px; border-top: 1px solid var(--graphite); color: var(--ash); font-size: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @keyframes card-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes land-amber { 0% { box-shadow: 0 0 0 0 rgba(240, 177, 61, 0.55); } 100% { box-shadow: 0 0 0 10px rgba(240, 177, 61, 0); } }
  @keyframes colflash { 0% { background: var(--amber-wash); } 100% { background: transparent; } }

  /* the column switcher only exists on a phone */
  #colnav { display: none; flex: none; }

  @media (max-width: 1100px) {
    .strip { grid-template-columns: minmax(0, 1fr); }
    #counters { flex-wrap: wrap; }
    .counter { flex: 1 1 30%; border-top: 1px solid var(--graphite); margin-top: -1px; }
    #colnav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 0 0 10px; }
    #colnav .btn { min-height: 44px; padding: 4px 6px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.2; }
    #colnav .btn .n { font-size: 14px; font-weight: 590; color: var(--paper); font-variant-numeric: tabular-nums; }
    #colnav .btn.amber-n .n { color: var(--amber); }
    #board, #board.with-rail { display: grid; grid-auto-flow: column; grid-auto-columns: 86vw; grid-template-columns: none; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; min-height: 420px; padding-bottom: 4px; }
    #rail { display: none; }
    .col { scroll-snap-align: start; }
  }
  @media (max-width: 820px) {
    header { grid-template-columns: 1fr auto; padding: 0 16px; }
    nav { grid-row: 2; grid-column: 1 / -1; justify-self: stretch; overflow-x: auto; }
    nav .btn { padding: 10px; min-height: 44px; }
    nav .btn.active::after { bottom: 0; }
    main { padding: 12px 16px 20px; }
    footer { padding: 12px 16px; }
    .cols { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    #hero .line { font-size: 20px; }
    .strip.opening #hero .line { font-size: 28px; }
    .card .foot .btn.small { min-height: 34px; }
    dialog#detail { width: 96vw; max-height: 92vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .card.enter, .card.leaving, .chip, #learned-bar .latest, .learned .ev, .col.flash .col-head { animation: none !important; transition: none !important; }
    .card.land-amber { animation: none !important; }
    .member[data-status="active"]::before { animation: none; }
    dialog#detail[open], dialog#detail.closing, dialog#detail::backdrop { transition: none !important; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"></span><span class="name">pakka</span><span class="sub" id="sub"></span></div>
    <nav>
      <button class="btn" id="b-board" data-action="board" disabled>Board</button>
      <button class="btn" id="b-review" data-action="review" disabled>Review</button>
      <button class="btn" id="b-montage" data-action="montage" disabled>Play 5 Fridays</button>
      <button class="btn" id="b-auto" data-action="autopilot" disabled>Autopilot</button>
      <button class="btn" id="b-learn" data-action="learning" disabled>Learning</button>
    </nav>
    <div class="tools">
      <button class="btn ghost" id="b-reset" data-action="reset" disabled>Reset</button>
    </div>
  </header>
  <main id="main"></main>
  <footer>
    <span class="classes">ledgers · payment rails · CRMs · email · databases · deploys · tickets</span>
    <span id="foot-note" class="muted"></span>
  </footer>
  <dialog id="detail" aria-labelledby="dlg-title"></dialog>
  <script src="/web/vendor/chart.umd.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
